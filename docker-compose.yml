# Hi5-Bot — Synology DS218+ / NAS deployment
#
# Container Manager (DSM 7.2+) supports docker-compose projects. Place this
# file in a project folder (e.g. /volume1/docker/hi5bot/) alongside a ./data
# directory holding config.toml, tokens.json, and (auto-created) hi5bot.db.
#
# The daemon runs as a long-lived container with two responsibilities:
#   1. Trading cron loop (wakes at 15:30 America/Toronto)
#   2. Web dashboard API on port 8080
#
# `restart: unless-stopped` survives DSM reboots.

services:
  hi5bot:
    build: .
    image: hi5bot:latest
    container_name: hi5bot
    restart: unless-stopped
    ports:
      - "8080:8080"             # Web dashboard API
    environment:
      TZ: America/Toronto
      RUST_LOG: info
      HI5BOT_BIND: "0.0.0.0:8080"
    volumes:
      # Single volume: tokens, state, db, and config persist across image updates.
      - ./data:/app/data
