[package]
name = "hi5bot"
version = "0.1.0"
edition = "2024"
description = "Unattended mechanical asset-allocation & grid rebalancing daemon for Questrade"
publish = false

[lib]
name = "hi5bot"
path = "src/lib.rs"

[[bin]]
name = "hi5bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.36", features = ["serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
anyhow = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# Release: build a smaller, statically-linkable binary for the NAS target.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
